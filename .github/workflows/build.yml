name: Build SnakeGame

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish Windows executable
        shell: pwsh
        run: ./scripts/build.ps1 -Package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnakeGame-win-x64
          path: |
            artifacts/packages/SnakeGame-win-x64.zip
            artifacts/publish/win-x64/**
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/packages/SnakeGame-win-x64.zip
          generate_release_notes: true
